<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NeoTJA Mobile</title>
<style>body{margin:0;padding:2rem;background:#0f1117;color:#cdd6f4;
  font:16px/1.7 "Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
a{color:#4f9cf9}</style>
</head><body>
<p id="m">NeoTJA Mobile を読み込んでいます…</p>
<p><a id="f" href="https://negi0128.github.io/NeoTJAEditor/NeoTJAEditor/neotja/assets/mobile.html?solo">開かないときはこちら</a></p>
<script>
const SRC="https://negi0128.github.io/NeoTJAEditor/NeoTJAEditor/neotja/assets/mobile.html";
(async()=>{
  try{
    if(!/(^|[?&])solo(=|&|$)/i.test(location.search||"")){
      const q=location.search?location.search+"&solo":"?solo";
      history.replaceState(null,"",location.pathname+q+location.hash);
    }
    const r=await fetch(SRC,{cache:"no-cache"});
    if(!r.ok)throw new Error(r.status);
    const html=await r.text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById("m").textContent=
      "読み込めませんでした。下のリンクから開いてください。";
  }
})();
</script>
</body></html>
